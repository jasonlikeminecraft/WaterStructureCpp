name: Python platform wheels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python-wheels.yml"
      - "assets/**"
      - "include/**"
      - "python/**"
      - "src/**"
      - "thirdparty/**"
      - "xmake.lua"
  pull_request:
    paths:
      - ".github/workflows/python-wheels.yml"
      - "assets/**"
      - "include/**"
      - "python/**"
      - "src/**"
      - "thirdparty/**"
      - "xmake.lua"

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python build tools
        run: python -m pip install build twine
      - name: Build platform wheel
        run: python python/build_wheel.py
      - name: Validate wheel metadata
        run: python -m twine check dist/python/*.whl
      - name: Install and import wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/python/*.whl
          python -c "import water_structure; print(water_structure.version(), water_structure.abi_version())"
      - uses: actions/upload-artifact@v4
        with:
          name: water-structure-${{ runner.os }}-${{ runner.arch }}
          path: dist/python/*.whl

  termux-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Install Python build tools
        run: python -m pip install build twine
      - name: Configure Android arm64-v8a
        run: >-
          xmake f -p android -a arm64-v8a
          --ndk="${{ steps.setup-ndk.outputs.ndk-path }}"
          -m release -y
      - name: Build Android shared library
        run: xmake build water_structure_shared
      - name: Build Termux wheel
        run: >-
          python python/build_wheel.py --skip-native-build
          --native-library build/android/arm64-v8a/release/libwater_structure_shared.so
          --platform-tag android_24_arm64_v8a
          --output dist/termux
      - name: Validate Termux wheel metadata
        run: python -m twine check dist/termux/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: water-structure-Termux-arm64-v8a
          path: dist/termux/*.whl
