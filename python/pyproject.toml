[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "water-structure"
version = "0.1.3"
description = "Streaming Minecraft structure conversion powered by WaterStructureCpp"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "jasonlikeminecraft" }]
keywords = ["minecraft", "bedrock", "schematic", "schem", "bdx", "mcworld"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/jasonlikeminecraft/WaterStructureCpp"
Repository = "https://github.com/jasonlikeminecraft/WaterStructureCpp"
Issues = "https://github.com/jasonlikeminecraft/WaterStructureCpp/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["water_structure*"]
namespaces = true

[tool.setuptools.package-data]
water_structure = [
    "*.dll",
    "*.so",
    "*.dylib",
    "*.pyd",
    "*.pyi",
    "py.typed",
    "assets/*.json",
    "assets/*-LICENSE",
    "assets/block_upgrade_schemas/*.json",
]
