[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-structure"
version = "0.1.0"
description = "Python ctypes bindings for WaterStructureCpp"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["water_structure"]
py-modules = ["water_structure"]

[tool.setuptools.package-data]
water_structure = ["*.dll", "*.pyd", "assets/**/*", "assets/**"]
